<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flashcard tiếng Hàn DeerEDU</title>
<style>
:root{--bg:#eef2f8;--card:#fff;--ink:#14213d;--mute:#5b6783;--line:#d5dcea;--acc:#2f5bea;--acc-ink:#fff;--ok:#16825d;--bad:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--card:#18223a;--ink:#e8edf8;--mute:#9aa7c4;--line:#2b3a5c;--acc:#7b9bff;--acc-ink:#0f1626;--ok:#4ade9f;--bad:#fb923c}}
:root[data-theme="dark"]{--bg:#0f1626;--card:#18223a;--ink:#e8edf8;--mute:#9aa7c4;--line:#2b3a5c;--acc:#7b9bff;--acc-ink:#0f1626;--ok:#4ade9f;--bad:#fb923c}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif;min-height:100vh}
main{max-width:620px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.25rem;margin:0 0 14px}
nav{display:flex;gap:6px;margin-bottom:18px}
nav button{flex:1;padding:10px 4px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
nav button[aria-selected=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px;color:var(--mute);font-size:.9rem}
.btn{padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn.main{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.ok{border-color:var(--ok);color:var(--ok)}.btn.bad{border-color:var(--bad);color:var(--bad)}
.deckrow{display:flex;gap:8px;align-items:stretch}
.stage{background:var(--card);border:2px solid var(--line);border-radius:18px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 14px;cursor:pointer;color:var(--ink);flex:1;min-width:0}
.stage .w{font-size:clamp(2rem,10vw,3.4rem);font-weight:700;line-height:1.25;word-break:keep-all;overflow-wrap:anywhere}
.stage .m{font-size:1.5rem;color:var(--acc);font-weight:600;overflow-wrap:anywhere}
.stage .hint{margin-top:14px;color:var(--mute);font-size:.85rem}
.stage.known{border-color:var(--ok)}
.arrow{flex:none;width:44px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font-size:2.2rem;line-height:1;padding:0}
.arrow:active{background:var(--acc);color:var(--acc-ink)}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
label{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],input:not([type]),select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
select{margin-bottom:14px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line)}
li b{min-width:38%}li span{flex:1;color:var(--mute)}
li.sec{display:block;margin-top:12px;font-weight:700;color:var(--acc);border-bottom:2px solid var(--acc)}
.tick{color:var(--ok)}.bad-t{color:var(--bad)}.ok-t{color:var(--ok)}
.empty{padding:36px 12px;text-align:center;color:var(--mute)}
.msg{min-height:1.5em;margin-top:8px}
#tname{margin:0 0 14px;padding-bottom:8px;border-bottom:2px solid var(--acc);font-size:1.15rem;line-height:1.3}
section[hidden]{display:none}
</style>
</head>
<body>
<main>
<h1>Flashcard tiếng Hàn DeerEDU</h1>
<nav role="tablist">
  <button role="tab" data-t="study" aria-selected="true">Học</button>
  <button role="tab" data-t="test" aria-selected="false">Kiểm tra</button>
  <button role="tab" data-t="list" aria-selected="false">Danh sách</button>
</nav>

<section id="study">
  <label for="deck" style="margin-top:0">Chọn bài học</label>
  <select id="deck"></select>
  <div class="bar">
    <span id="pos"></span>
    <label style="display:inline;font-weight:400;margin:0"><input type="checkbox" id="onlyNew" style="width:auto"> Chỉ thẻ chưa thuộc</label>
  </div>
  <div class="deckrow">
    <button class="arrow" id="prev" aria-label="Thẻ trước">&#8249;</button>
    <button class="stage" id="stage" aria-live="polite"></button>
    <button class="arrow" id="next" aria-label="Thẻ sau">&#8250;</button>
  </div>
  <div class="row"><button class="btn" id="speak">Nghe phát âm</button></div>
  <div class="row">
    <button class="btn bad" id="no">Chưa thuộc</button>
    <button class="btn ok" id="yes">Đã thuộc</button>
  </div>
  <div class="row">
    <button class="btn" id="shuffle">Xáo trộn thẻ</button>
    <button class="btn" id="resetDeck">Đặt lại bài này</button>
  </div>
  <div class="row"><button class="btn" id="side">Đổi mặt hỏi: <span id="sideTxt">tiếng Hàn</span></button></div>
</section>

<section id="test" hidden>
  <h2 id="tname" hidden></h2>
  <div id="tsetup">
    <label for="tdeck" style="margin-top:0">Bài học</label>
    <select id="tdeck"></select>
    <label for="tdir">Kiểu kiểm tra</label>
    <select id="tdir"><option value="kv">Nhìn tiếng Hàn, gõ nghĩa tiếng Việt</option><option value="vk">Nhìn nghĩa tiếng Việt, gõ tiếng Hàn</option></select>
    <label for="tn">Số câu</label>
    <select id="tn"><option value="10">10 câu</option><option value="20">20 câu</option><option value="0">Tất cả</option></select>
    <div class="row"><button class="btn main" id="tstart">Bắt đầu kiểm tra</button></div>
  </div>
  <div id="tbox" hidden>
    <div class="bar"><span id="tpos"></span><span id="tscore"></span></div>
    <div class="stage" id="tq" style="cursor:default;width:100%"></div>
    <input id="ta" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Câu trả lời" style="margin-top:12px;font-size:1.15rem">
    <div class="msg" id="tfb" role="status" style="font-weight:600"></div>
    <div class="row"><button class="btn main" id="tcheck">Kiểm tra</button><button class="btn" id="tskip">Bỏ qua</button><button class="btn" id="tchange">Đổi bài</button></div>
  </div>
  <div id="tres" hidden>
    <div class="stage" style="cursor:default;width:100%"><div class="w" id="tsum"></div></div>
    <ul id="twrong"></ul>
    <div class="row"><button class="btn main" id="tagain">Làm lại</button><button class="btn" id="tback">Đổi bài khác</button></div>
  </div>
</section>

<section id="list" hidden>
  <div class="bar"><span id="count"></span><span>Bài đang chọn ở tab Học</span></div>
  <ul id="ul"></ul>
</section>
</main>

(function(){

}

fillSel(sel,deck);cur=deckCards(deck);
sel.onchange=function(){deck=sel.value;cur=deckCards(deck);rebuild();show();renderList()};
$("stage").onclick=flip;$("prev").onclick=function(){move(-1)};$("next").onclick=function(){move(1)};
$("yes").onclick=function(){mark(true)};$("no").onclick=function(){mark(false)};$("speak").onclick=speak;
$("onlyNew").onchange=function(){rebuild();show()};
$("resetDeck").onclick=function(){if(confirm("Đặt lại bài này về chưa thuộc?")){cur.forEach(function(c){delete known[c.id]});save();rebuild();show();renderList()}};
$("shuffle").onclick=function(){for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=order[i];order[i]=order[j];order[j]=t}idx=0;flipped=false;show()};
$("side").onclick=function(){front=front==="k"?"v":"k";$("sideTxt").textContent=front==="k"?"tiếng Hàn":"tiếng Việt";flipped=false;show()};
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){
  document.querySelectorAll("nav button").forEach(function(x){x.setAttribute("aria-selected",x===b)});
  ["study","test","list"].forEach(function(s){$(s).hidden=s!==b.dataset.t})}});
document.addEventListener("keydown",function(e){
  if(!$("study").hidden&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){
    if(e.key===" "){e.preventDefault();flip()}else if(e.key==="ArrowRight")move(1);else if(e.key==="ArrowLeft")move(-1)}});

/* ===== Kiểm tra ===== */
var tsel=$("tdeck");fillSel(tsel,"1");
var qs=[],qi=0,sc=0,wr=[],done=false,tcards=[];
function nv(t){return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
function nk(t){return t.normalize("NFC").replace(/[\s?.!,()~\/…]/g,"")}
function okVi(ans,v){
  var a=nv(ans);if(!a)return false;
  var base=v.replace(/\([^)]*\)/g,"").trim(),alts=base.split(",");alts.push(base);
  if(base.indexOf("/")>-1&&base.split(/\s+/).length<=4)base.split("/").forEach(function(x){alts.push(x)});
  return alts.some(function(x){return nv(x)===a});
}
function altsKo(k){var b=k.replace(/\([^)]*\)/g,"").replace(/…|\.\.\./g,""),r=[k,b];b.split(/~|\//).forEach(function(x){r.push(x)});return r}
function isRight(ans,q,dir){
  if(dir==="kv")return okVi(ans,q.v);
  var a=nk(ans);if(!a)return false;
  return tcards.some(function(c){return c.v===q.v&&altsKo(c.k).some(function(x){return nk(x)===a})});
}
function showQ(){
  var q=qs[qi],dir=$("tdir").value;
  $("tpos").textContent="Câu "+(qi+1)+" / "+qs.length+(q.s?" · "+q.s:"");$("tscore").textContent="Đúng: "+sc;
  $("tq").innerHTML=dir==="kv"?'<div class="w"></div>':'<div class="m"></div>';
  $("tq").firstChild.textContent=dir==="kv"?q.k:q.v;
  var a=$("ta");a.value="";a.disabled=false;a.placeholder=dir==="kv"?"Gõ nghĩa tiếng Việt":"Gõ từ tiếng Hàn";a.focus();
  $("tfb").textContent="";$("tfb").className="msg";$("tcheck").textContent="Kiểm tra";$("tskip").hidden=false;done=false;
}
function finish(){
  $("tbox").hidden=true;$("tres").hidden=false;$("tsum").textContent=sc+" / "+qs.length;
  var ul=$("twrong");ul.innerHTML="";
  if(!wr.length){ul.innerHTML='<li class="empty" style="display:block">Bạn trả lời đúng tất cả. Rất tốt!</li>';return}
  wr.forEach(function(c){var li=document.createElement("li"),b=document.createElement("b"),s=document.createElement("span");b.textContent=c.k;s.textContent=c.v;li.appendChild(b);li.appendChild(s);ul.appendChild(li)});
}
function act(skip){
  if(done){qi++;if(qi>=qs.length)finish();else showQ();return}
  var q=qs[qi],dir=$("tdir").value,right=!skip&&isRight($("ta").value,q,dir);
  if(right)sc++;else wr.push(q);
  var fb=$("tfb");fb.className="msg "+(right?"ok-t":"bad-t");
  fb.textContent=right?"Đúng rồi! "+q.k+" = "+q.v:(skip?"Đáp án: ":"Chưa đúng. Đáp án: ")+q.k+" = "+q.v;
  $("tscore").textContent="Đúng: "+sc;$("ta").disabled=true;
  $("tcheck").textContent=qi+1>=qs.length?"Xem kết quả":"Câu tiếp";$("tskip").hidden=true;done=true;
}
function start(){
  tcards=deckCards(tsel.value).slice();
  var a=tcards.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}
  var n=parseInt($("tn").value,10);qs=n?a.slice(0,n):a;qi=0;sc=0;wr=[];
  $("tname").textContent=tsel.options[tsel.selectedIndex].dataset.name;$("tname").hidden=false;
  $("tsetup").hidden=true;$("tres").hidden=true;$("tbox").hidden=false;showQ();
}
$("tstart").onclick=start;$("tagain").onclick=start;
$("tback").onclick=function(){$("tres").hidden=true;$("tbox").hidden=true;$("tname").hidden=true;$("tsetup").hidden=false};
$("tchange").onclick=function(){if(sc+wr.length>0&&!confirm("Thoát bài kiểm tra hiện tại để chọn bài khác?"))return;$("tback").onclick()};
$("tcheck").onclick=function(){act(false)};$("tskip").onclick=function(){act(true)};
$("ta").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();act(false)}});
rebuild();show();renderList();
})();
</script>
</body>
